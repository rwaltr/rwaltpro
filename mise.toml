min_version = "2026.8.0"

[settings]
task.timings = true

[tools]
hugo-extended = "0.169.0"
ffmpeg = "latest"

# Git hooks (hk.pkl) — hk needs pkl to evaluate its config.
# hk is pinned to match the version hk.pkl amends; bump both together.
hk = "1.45.0"
pkl = "latest"

# Dev server supervision (the daemon backend mise ships) — see pitchfork.toml
pitchfork = "latest"

# Linters run via `mise run lint` and hk (see hk.pkl)
actionlint = "latest"
editorconfig-checker = "latest"
"npm:markdownlint-cli2" = "latest"
"pipx:yamllint" = "latest"
shellcheck = "latest"
typos = "latest"

[tasks.serve]
description = "Start the Hugo dev server under pitchfork"
run = "pitchfork start hugo"

[tasks."serve:status"]
description = "Show the Hugo dev server status"
run = "pitchfork status hugo"

[tasks."serve:logs"]
description = "Tail the Hugo dev server logs"
run = "pitchfork logs hugo -f"

[tasks."serve:stop"]
description = "Stop the Hugo dev server"
run = "pitchfork stop hugo"

[tasks.build]
description = "Build the site for production"
run = "hugo --minify"

[tasks.new]
description = "Create a new post"
run = "hugo new posts/$1/index.md"

[tasks.lint]
description = "Lint all files (hk check)"
run = "hk check --all"

[tasks.fmt]
description = "Auto-fix all files (hk fix)"
run = "hk fix --all"

[tasks.hooks]
description = "Install git hooks via hk"
run = "hk install"
